{% extends "base.html" %}
{% block title %}Config comisiones{% endblock %}
{% block content %}
<h2 class="h5 mb-3">Reglas de comisión</h2>
<form method="post" class="card p-4">
  <div class="mb-3"><label class="form-label">% comisión base (primer pago)</label><input name="porcentaje_base" type="number" step="0.1" class="form-control" value="{{ cfg.porcentaje_base }}"></div>
  <div class="mb-3"><label class="form-label">% comisión alto ticket (mensualidad)</label><input name="porcentaje_alto_ticket" type="number" step="0.1" class="form-control" value="{{ cfg.porcentaje_alto_ticket }}"></div>
  <div class="mb-3"><label class="form-label">Umbral alto ticket (CLP)</label><input name="umbral_alto_ticket" type="number" class="form-control" value="{{ cfg.umbral_alto_ticket }}"></div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="acumula_alto_ticket" id="acum" {% if cfg.acumula_alto_ticket %}checked{% endif %}>
    <label class="form-check-label" for="acum">Acumular comisión base + alto ticket</label>
  </div>
  <button class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('commercial.comisiones_list') }}" class="btn btn-outline-secondary">Volver</a>
</form>
{% endblock %}
